data_dir = "/var/lib/vector"


# ============================================================
# SOURCE: AICTE APPLICATION LOGS
# ============================================================

[sources.aicte_logs]

type = "file"

include = [
    "/var/log/aicte/application.log"
]

read_from = "beginning"

max_line_bytes = 1048576


# ============================================================
# TRANSFORM: PARSE JSON LOG
# ============================================================

[transforms.parse_json]

type = "remap"

inputs = [
    "aicte_logs"
]

source = '''
. = parse_json!(.message)
'''


# ============================================================
# TRANSFORM: PREPARE LOG FOR AI CLASSIFICATION
# ============================================================

[transforms.prepare_classification]

type = "remap"

inputs = [
    "parse_json"
]

source = '''
. = {
    "timestamp": .timestamp,
    "uuid": .uuid,
    "trace_id": .trace_id,
    "request_id": .request_id,
    "client_ip": .client_ip,
    "response_time_ms": .response_time_ms,
    "latency": .latency,
    "status_code": .status_code,
    "endpoint": .endpoint,
    "method": .method,
    "service": .service,
    "host": .host,
    "container": .container,
    "region": .region,
    "level": .level,
    "message": .message,
    "payload": .payload
}
'''

# ============================================================
# SINK: AI CLASSIFICATION SERVICE
# ============================================================

[sinks.classifier]

type = "http"

inputs = [
    "prepare_classification"
]

uri = "http://classifier:8000/classify"

method = "post"

encoding.codec = "json"

healthcheck.enabled = false

healthcheck.uri = "http://classifier:8000/health"

request.timeout_secs = 10

request.retry_attempts = 5

request.retry_backoff_secs = 2

request.retry_max_duration_secs = 30

batch.max_events = 1

batch.timeout_secs = 1


# ============================================================
# SINK: OPENSEARCH
# ============================================================

[sinks.opensearch]

type = "elasticsearch"

inputs = [
    "parse_json"
]

endpoints = [
    "http://opensearch:9200"
]

opensearch_service_type = "managed"

api_version = "v7"

mode = "bulk"

bulk.index = "aicte-logs-%Y.%m.%d"

healthcheck.enabled = true

acknowledgements.enabled = true

batch.max_events = 100

batch.timeout_secs = 2

buffer.type = "disk"

buffer.max_size = 268435488

buffer.when_full = "block"

request.timeout_secs = 30

request.retry_attempts = 5

request.retry_backoff_secs = 2

request.retry_max_duration_secs = 30