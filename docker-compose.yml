services:

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: opensearch

    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD= "${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-ChangeThisPassword}"
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9200:9200"
      - "9600:9600"

    volumes:
      - opensearch-data:/usr/share/opensearch/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200 >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1

    container_name: dashboards

    ports:
      - "5601:5601"

    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"

    depends_on:
      opensearch:
        condition: service_healthy

    restart: unless-stopped

  vector:
    image: timberio/vector:0.57.0-debian

    container_name: vector

    command:
      - "--config"
      - "/etc/vector/vector.toml"
    ports:
      - "8686:8686"
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - ./logs:/var/log/aicte:ro
      - vector-data:/var/lib/vector

    depends_on:
      opensearch:
        condition: service_healthy

    restart: unless-stopped
  classifier:
    build:
      context: .
      dockerfile: classifier/Dockerfile

    container_name: classifier

    ports:
      - "8000:8000"	
    environment:
      OPENSEARCH_HOST: "http://opensearch:9200"
      NOTIFICATION_URL: "http://notification:8001/notify"
      
    depends_on:
      opensearch:
        condition: service_healthy
      notification:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification:
    build:
      context: .
      dockerfile: notification/Dockerfile

    container_name: notification

    ports:
      - "8001:8001"

    environment:
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      SMTP_SERVER: "${SMTP_SERVER:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
      ALERT_DEDUP_WINDOW_SECONDS: "${ALERT_DEDUP_WINDOW_SECONDS:-300}"
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  action-api:
    build:
      context: .
      dockerfile: action_api/Dockerfile

    container_name: action-api

    ports:
      - "8002:8002"

    volumes:
      - ./logs:/var/log/aicte

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:

  opensearch-data:

  vector-data: