<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Payment | AICTE Demo Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link href="css/style.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <i class="bi bi-building me-2"></i>
            AICTE Demo Portal
        </a>

        <a class="btn btn-sm btn-outline-light" href="student.html">
            Student Dashboard
        </a>

    </div>
</nav>


<main class="page-shell">

    <div class="container py-5">

        <div class="row g-4">

            <!-- PAYMENT FORM -->
            <div class="col-lg-7">

                <div class="section-label">
                    Payment gateway
                </div>

                <h1 class="h2">
                    Payment
                </h1>

                <p class="text-secondary">
                    This is a simulated payment page.
                    No real payment gateway is connected.
                </p>


                <div class="card portal-card">

                    <div class="card-body p-4">

                        <form
                            id="action-form"
                            data-action="payment_success"
                            class="row g-3"
                        >

                            <div class="col-md-6">

                                <label class="form-label">
                                    Student ID
                                </label>

                                <input
                                    name="student_id"
                                    class="form-control"
                                    value="STU-10293"
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Amount (₹)
                                </label>

                                <input
                                    name="amount"
                                    type="number"
                                    class="form-control"
                                    value="5000"
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Payment Method
                                </label>

                                <select
                                    name="payment_method"
                                    class="form-select"
                                >

                                    <option>UPI</option>
                                    <option>Card</option>
                                    <option>Net Banking</option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Transaction ID
                                </label>

                                <input
                                    name="transaction_id"
                                    class="form-control"
                                    value="TXN-DEMO-10293"
                                >

                            </div>


                            <div class="col-12">

                                <button
                                    id="btn-pay-now"
                                    data-action="payment_success"
                                    type="submit"
                                    class="btn btn-primary action-btn"
                                >

                                    <i class="bi bi-lock me-1"></i>
                                    Pay Now

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>


            <!-- DEMO SCENARIOS -->
            <div class="col-lg-5">

                <div class="card demo-panel">

                    <div class="card-body p-4">

                        <div class="section-label">
                            Demo scenarios
                        </div>

                        <h2 class="h5 mt-2">
                            Payment Scenarios
                        </h2>

                        <p class="small text-secondary">
                            Each scenario generates a realistic server
                            log and sends it through the monitoring pipeline.
                        </p>


                        <div class="d-grid gap-2 mt-3">


                            <!-- SUCCESS -->
                            <button
                                id="btn-payment-success"
                                data-action="payment_success" type="button"
                                class="btn btn-outline-success action-btn"
                            >
                                Successful Payment
                            </button>


                            <!-- TIMEOUT -->
                            <button
                                id="btn-payment-timeout"
                                data-action="payment_timeout" type="button"
                                class="btn btn-outline-warning action-btn"
                            >
                                Gateway Timeout
                            </button>


                            <!-- FRAUD -->
                            <button
                                id="btn-fraudulent-payment"
                                data-action="fraudulent_payment" type="button"
                                class="btn btn-outline-danger action-btn"
                            >
                                Fraudulent Payment
                            </button>


                            <!-- DATABASE FAILURE -->
                            <button
                                id="btn-database-failure"
                                data-action="database_failure" type="button"
                                class="btn btn-outline-danger action-btn"
                            >
                                Database Failure
                            </button>


                            <!-- SERVICE FAILURE -->
                            <button
                                id="btn-service-failure"
                                data-action="service_failure" type="button"
                                class="btn btn-outline-dark action-btn"
                            >
                                Service Failure
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- ACTION RESULT -->
        <div
            id="action-result"
            class="card result-card mt-4 d-none"
        >

            <div class="card-body">

                <div class="result-icon">

                    <i class="bi bi-check-circle-fill me-2"></i>

                    Action Result

                </div>

                <div
                    class="mt-2 fw-semibold"
                    id="result-action"
                ></div>

                <div
                    class="small text-secondary"
                    id="result-detail"
                ></div>

            </div>

        </div>

    </div>

</main>


<script src="js/api.js"></script>
<script src="js/actions.js"></script>
<script src="js/app.js"></script>

</body>
</html>
