<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | AICTE Demo Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-building me-2"></i>AICTE Demo Portal</a><a class="btn btn-sm btn-outline-light" href="login.html">Back to Login</a></div></nav><main class="page-shell"><div class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="card portal-card"><div class="card-body p-4 p-md-5"><div class="section-label">Student portal</div><h1 class="h3 mt-2">Create Demo Account</h1><p class="text-secondary">This is a frontend-only registration flow. No real account is created.</p><form id="action-form" data-action="register" class="row g-3"><div class="col-md-6"><label class="form-label">Full Name</label><input name="full_name" class="form-control" required></div><div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div><div class="col-md-6"><label class="form-label">Username</label><input name="username" class="form-control" required></div><div class="col-md-6"><label class="form-label">Role</label><select name="role" class="form-select" required><option value="" selected disabled>Select role</option><option>Student</option><option>Teacher</option><option>Developer</option></select></div><div class="col-md-6"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div><div class="col-md-6"><label class="form-label">Confirm Password</label><input name="confirm_password" type="password" class="form-control" required></div><div class="col-12"><button id="btn-register-submit" data-action="register" type="submit" class="btn btn-primary action-btn">Create Account</button></div></form></div></div><div id="action-result" class="card result-card mt-4 d-none"><div class="card-body"><div class="result-icon"><i class="bi bi-check-circle-fill me-2"></i>Action Result</div><div class="mt-2 fw-semibold" id="result-action"></div><div class="small text-secondary" id="result-detail"></div></div></div></div></div></div></main><script src="js/api.js"></script><script src="js/actions.js"></script><script src="js/app.js"></script></body></html>
