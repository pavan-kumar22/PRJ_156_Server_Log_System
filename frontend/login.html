<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | AICTE Demo Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-building me-2"></i>AICTE Demo Portal</a><a class="btn btn-sm btn-outline-light" href="index.html">Back to home</a></div></nav>
<main class="page-shell"><div class="container py-5"><div class="row justify-content-center"><div class="col-lg-6"><div class="card portal-card"><div class="card-body p-4 p-md-5"><div class="section-label">Authentication service</div><h1 class="h3 mt-2">Login</h1><p class="text-secondary">Choose your portal, then enter credentials to continue.</p><form id="action-form" data-action="login_success" class="row g-3" novalidate><div class="col-12"><label class="form-label">Email / Username</label><input name="username" class="form-control" placeholder="Enter email or username" required></div><div class="col-md-7"><label class="form-label">Password</label><input name="password" type="password" class="form-control" placeholder="Enter password" required></div><div class="col-md-5"><label class="form-label">Role</label><select name="role" class="form-select" required><option value="" selected disabled>Select role</option><option>Student</option><option>Faculty</option><option>Admin</option></select></div><div class="col-12 d-flex flex-wrap gap-2"><button id="btn-login" data-action="login_success" class="btn btn-primary action-btn" type="submit">Login</button><button id="btn-register" data-action="register" class="btn btn-light action-btn" type="button">Register</button><button id="btn-forgot-password" data-action="forgot_password" class="btn btn-link action-btn" type="button">Forgot password</button></div></form><hr class="my-4"><div class="demo-panel rounded p-3"><div class="fw-semibold mb-2">Login simulation</div><div class="d-flex flex-wrap gap-2"><button id="btn-login-success" data-action="login_success" class="btn btn-sm btn-outline-success action-btn">Successful Login</button><button id="btn-login-failure" data-action="login_failure" class="btn btn-sm btn-outline-danger action-btn">Failed Login</button><button id="btn-invalid-token" data-action="invalid_token" class="btn btn-sm btn-outline-warning action-btn">Invalid Token</button><button id="btn-unauthorized-access" data-action="unauthorized_access" class="btn btn-sm btn-outline-secondary action-btn">Unauthorized Access</button><button id="btn-session-timeout" data-action="session_timeout" class="btn btn-sm btn-outline-secondary action-btn">Session Timeout</button></div></div></div></div><div id="action-result" class="card result-card mt-4 d-none"><div class="card-body"><div class="result-icon"><i class="bi bi-check-circle-fill me-2"></i>Action Result</div><div class="mt-2 fw-semibold" id="result-action"></div><div class="small text-secondary" id="result-detail"></div></div></div></div></div></div></main><script src="js/api.js"></script><script src="js/actions.js"></script><script src="js/app.js"></script></body></html>
