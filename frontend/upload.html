<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Upload Document | AICTE Demo Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-building me-2"></i>AICTE Demo Portal</a><a class="btn btn-sm btn-outline-light" href="student.html">Student Dashboard</a></div></nav><main class="page-shell"><div class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="section-label">Document service</div><h1 class="h2">Upload Document</h1><p class="text-secondary">Choose a document to simulate document processing actions.</p><div class="card portal-card"><div class="card-body p-4"><form id="action-form" data-action="document_upload" class="row g-3"><div class="col-md-6"><label class="form-label">Student ID</label><input name="student_id" class="form-control" value="STU-10293"></div><div class="col-md-6"><label class="form-label">Document Type</label><select name="document_type" class="form-select"><option>Aadhaar</option><option>Marksheet</option><option>Certificate</option><option>ID Proof</option><option>Other</option></select></div><div class="col-12"><label class="form-label">Choose File</label><input name="file" type="file" class="form-control"></div><div class="col-12 d-flex flex-wrap gap-2"><button id="btn-upload-document" data-action="document_upload" type="submit" class="btn btn-primary action-btn">Upload Document</button><button id="btn-invalid-document" data-action="document_invalid" type="button" class="btn btn-outline-warning action-btn">Simulate Invalid Format</button><button id="btn-download-document" data-action="document_download" type="button" class="btn btn-outline-secondary action-btn">Download Document</button><button id="btn-delete-document" data-action="document_delete" type="button" class="btn btn-outline-danger action-btn">Delete Document</button></div></form></div></div><div class="alert alert-light border mt-4"><i class="bi bi-shield-check me-2"></i>Demo only: no files are stored or sent to an external service.</div><div id="action-result" class="card result-card mt-4 d-none"><div class="card-body"><div class="result-icon"><i class="bi bi-check-circle-fill me-2"></i>Action Result</div><div class="mt-2 fw-semibold" id="result-action"></div><div class="small text-secondary" id="result-detail"></div></div></div></div></div></div></main><script src="js/api.js"></script><script src="js/actions.js"></script><script src="js/app.js"></script></body></html>
